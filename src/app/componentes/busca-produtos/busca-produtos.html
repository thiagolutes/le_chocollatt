<div class="busca">
  <svg viewBox="0 0 24 24" class="icone" aria-hidden="true">
    <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.4" />
    <path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
  </svg>
  <input
    type="search"
    class="entrada campoBusca"
    placeholder="Buscar doces..."
    aria-label="Buscar produtos pelo nome"
    [value]="termo()"
    (input)="termo.set($any($event.target).value)"
  />
</div>
