<li class="item">
  <app-imagem-produto [produto]="item().produto" />

  <div class="detalhes">
    <p class="nome">{{ item().produto.nome }}</p>
    @if (item().variacao) {
      <p class="variacao">{{ item().variacao?.nome }}</p>
    }
    <p class="precoUnitario">{{ formatarMoeda(item().precoUnitario) }} / un.</p>

    <div class="linhaAcoes">
      <div class="seletorQuantidade">
        <button type="button" (click)="diminuir()" [disabled]="!podeDiminuir()" aria-label="Diminuir quantidade">−</button>
        <input
          type="number"
          min="1"
          max="50"
          [value]="item().quantidade"
          (change)="atualizarQuantidade($event)"
          (keydown.enter)="atualizarQuantidade($event)"
          aria-label="Quantidade"
          class="inputQuantidade"
        />
        <button type="button" (click)="aumentar()" aria-label="Aumentar quantidade">+</button>
      </div>

      <button
        type="button"
        class="botaoRemover"
        (click)="remover()"
        [attr.aria-label]="'Remover ' + item().produto.nome + ' do carrinho'"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2m-8 0 1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none"
          />
        </svg>
      </button>
    </div>
  </div>

  <span class="subtotal">{{ formatarMoeda(item().subtotal) }}</span>
</li>
